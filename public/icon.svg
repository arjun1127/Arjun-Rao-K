<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 6px #00F0FF); opacity: 0.95; }
      50% { filter: drop-shadow(0 0 16px #7000FF); opacity: 1; }
    }
    @keyframes floatBrackets {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes floatDelay {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    .glowing-head {
      animation: pulseGlow 3s ease-in-out infinite;
    }
    .floating-code-1 {
      animation: floatBrackets 2.5s ease-in-out infinite;
      transform-origin: center;
    }
    .floating-code-2 {
      animation: floatDelay 3s ease-in-out infinite;
      transform-origin: center;
    }
  </style>

  <!-- Glowing Animated Developer Profile Silhouette -->
  <g class="glowing-head">
    <!-- Cybernetic Circuit Backdrop Ring -->
    <circle cx="230" cy="256" r="200" fill="none" stroke="url(#cyanPurple)" stroke-width="4" stroke-dasharray="16 10" opacity="0.4" />
    
    <!-- Cyber Hair & Crown -->
    <path d="M 130,240 C 130,130 210,90 290,90 C 330,90 350,110 370,135 C 340,145 320,165 300,165 C 260,165 240,130 185,140 C 155,145 140,170 140,210 Z" fill="url(#cyanPurple)" opacity="0.85" />
    
    <!-- Glowing Head Contour -->
    <path d="M 290,90 C 350,90 390,130 390,200 C 390,220 380,240 370,250 C 385,265 375,285 355,290 C 345,320 320,350 280,380 L 250,420 L 220,380 L 160,370 C 140,310 130,260 130,240" fill="none" stroke="#00F0FF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />

    <!-- Cyber Ear Node & Eye Interface -->
    <circle cx="220" cy="250" r="26" fill="none" stroke="#FF007A" stroke-width="6" />
    <circle cx="220" cy="250" r="10" fill="#00F0FF" />
    <line x1="310" y1="215" x2="365" y2="215" stroke="#00F0FF" stroke-width="10" stroke-linecap="round" />
  </g>

  <!-- Floating Animated Code Symbols -->
  <g class="floating-code-1">
    <text x="400" y="170" font-family="'Courier New', monospace" font-size="72" font-weight="900" fill="#00F0FF" filter="url(#neonGlow)">{</text>
    <text x="435" y="320" font-family="'Courier New', monospace" font-size="72" font-weight="900" fill="#7000FF" filter="url(#neonGlow)">}</text>
  </g>

  <g class="floating-code-2">
    <text x="385" y="245" font-family="'Courier New', monospace" font-size="54" font-weight="900" fill="#FF007A" filter="url(#neonGlow)">&lt;/&gt;</text>
    <text x="415" y="390" font-family="'Courier New', monospace" font-size="52" font-weight="900" fill="#00F0FF" filter="url(#neonGlow)">;</text>
  </g>
</svg>
